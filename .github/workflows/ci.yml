name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Pytest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      DATABASE_URL: ''
      CHORES_PUBLIC_URL: ''
      CHORES_SETUP_KEY: ''
      CHORES_TRUSTED_PROXY: ''
      CHORES_REQUIRE_DATA_MOUNT: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            requirements.txt
            backend/requirements.txt
      - name: Install test dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip check
      - name: Test with disposable SQLite files
        run: |
          export CHORES_DB="$RUNNER_TEMP/chores-ci.sqlite3"
          python -m pytest -ra --basetemp "$RUNNER_TEMP/chores-pytest"

  docker:
    name: Docker build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: sqlite
            dockerfile: Dockerfile
          - variant: azure-sql
            dockerfile: Dockerfile.azure
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build container
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: docker build --file "$DOCKERFILE" --tag chores-ci:check .
      - name: Check installed Python dependencies
        run: docker run --rm chores-ci:check python -m pip check
      - name: Check SQL Server driver without opening a connection
        if: matrix.variant == 'azure-sql'
        run: >-
          docker run --rm chores-ci:check python -c
          'import pyodbc; assert "ODBC Driver 18 for SQL Server" in pyodbc.drivers()'

  dependencies:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-azure.txt
      - name: Audit resolved runtime packages
        run: |
          python -m pip install 'pip-audit>=2.9,<3'
          python -m pip_audit -r backend/requirements-azure.txt --progress-spinner off
